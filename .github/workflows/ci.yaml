name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run poe lint
      - name: Type-check
        run: uv run poe typecheck
      # tests/test_integration_postgres.py starts a disposable postgres:17 container through
      # testcontainers; the runner's Docker serves it.
      - name: Run tests
        run: uv run poe test

  dependabot-automerge:
    needs: [python]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # SHA-pinned: this is the one step that runs with a write-scoped token.
      - name: Read the update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # An allow-list, so an update fetch-metadata cannot classify waits for a human. Patches
      # merge; minors only for development dependencies.
      - name: Enable auto-merge for patches and development minors
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
          steps.metadata.outputs.dependency-type == 'direct:development')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
